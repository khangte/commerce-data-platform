name: commerce-data-platform

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: commerce-data-platform-airflow:3.3.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-6}"
    SOURCE_DAG_SCHEDULE: ${SOURCE_DAG_SCHEDULE:-@hourly}
    AIRFLOW__WORKERS__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_METADATA_DB}"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    SEAWEEDFS_HOST: seaweedfs
    SEAWEEDFS_S3_PORT: "8333"
    SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
    SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET}
    COMMERCE_SOURCE_DB: ${COMMERCE_SOURCE_DB}
    SOURCE_DB_USER: ${SOURCE_DB_USER}
    SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
    PIPELINE_METADATA_DB: ${PIPELINE_METADATA_DB}
    PIPELINE_DB_USER: ${PIPELINE_DB_USER}
    PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
    INGESTION_PAGE_SIZE: ${INGESTION_PAGE_SIZE:-50000}
    PYTHONPATH: /opt/airflow/project
    WAREHOUSE_PATH: /opt/airflow/project/data/warehouse/warehouse.duckdb
    DBT_PROJECT_DIR: /opt/airflow/project/dbt
    DBT_PROFILES_DIR: /opt/airflow/project/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  working_dir: /opt/airflow/project
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/project/src:ro
    - ./sql:/opt/airflow/project/sql:ro
    - ./dbt:/opt/airflow/project/dbt
    - ./data/warehouse:/opt/airflow/project/data/warehouse
    - ./data/serving:/opt/airflow/project/data/serving
  profiles:
    - airflow

x-airflow-runtime-depends-on: &airflow-runtime-depends-on
  postgres:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      COMMERCE_SOURCE_DB: ${COMMERCE_SOURCE_DB}
      AIRFLOW_METADATA_DB: ${AIRFLOW_METADATA_DB}
      PIPELINE_METADATA_DB: ${PIPELINE_METADATA_DB}
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      PIPELINE_DB_USER: ${PIPELINE_DB_USER}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      METABASE_DB_NAME: ${METABASE_DB_NAME}
      METABASE_DB_USER: ${METABASE_DB_USER}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    command:
      - server
      - -s3
      - -s3.port=8333
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    ports:
      - "${SEAWEEDFS_S3_PORT}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://seaweedfs:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  metabase:
    build:
      context: ./metabase
      dockerfile: Dockerfile
    image: commerce-data-platform-metabase:v0.63.16.1
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_PLUGINS_DIR: /plugins
      JAVA_OPTS: -Xmx1g
    ports:
      - "${METABASE_PORT}:3000"
    volumes:
      - ./data/serving:/serving:ro
      - ./metabase/plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    restart: "no"
    profiles:
      - bi

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on: *airflow-runtime-depends-on
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: *airflow-runtime-depends-on
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: *airflow-runtime-depends-on
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
