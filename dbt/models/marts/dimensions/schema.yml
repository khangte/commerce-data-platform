version: 2

models:
  - name: dim_customer
    description: 사람 단위 구독 상태와 거래 실적 등급의 SCD2 Version Dimension이다.
    columns:
      - name: customer_key
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
      - name: subscription_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [NON_MEMBER, TRIAL, ACTIVE, PAYMENT_FAILED, CANCEL_REQUESTED, CHURNED]
      - name: membership_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [BRONZE, SILVER, GOLD]
      - name: valid_from
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
