version: 2

models:
  - name: fact_orders
    description: 주문 Grain Fact다. Item/Payment는 이미 주문 단위로 집계되어 반영되어 있다.
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: fact_order_items
    description: 주문 Line Grain Fact다. 복합 PK는 tests/fact_order_items_unique.sql이 검증한다.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]

  - name: fact_payments
    description: 결제 Sequence Grain Fact다. 복합 PK는 tests/fact_payments_unique.sql이 검증한다.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_sequence
        data_tests: [not_null]

  - name: fact_subscription_payments
    description: 고객별 청구 순번 Grain의 구독 결제 Fact다. 복합 PK는 tests/fact_subscription_payments_unique.sql이 검증한다.
    columns:
      - name: customer_unique_id
        data_tests: [not_null]
      - name: billing_sequence
        data_tests: [not_null]
      - name: payment_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [completed, failed]
