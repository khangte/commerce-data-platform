version: 2

models:
  - name: fact_orders
    description: 주문 Grain Fact다. Item/Payment는 이미 주문 단위로 집계되어 반영되어 있다.
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: fact_order_items
    description: 주문 Line Grain Fact다. 복합 PK는 tests/fact_order_items_unique.sql이 검증한다.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]

  - name: fact_payments
    description: 결제 Sequence Grain Fact다. 복합 PK는 tests/fact_payments_unique.sql이 검증한다.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_sequence
        data_tests: [not_null]

  - name: fact_subscription_payments
    description: 계약별 구독 결제 시도 Grain의 Fact다. 청구 회차·시도 조합은 Singular Test가 검증한다.
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: subscription_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscription')
                field: subscription_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: payment_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: subscription_id
        data_tests: [not_null]
      - name: billing_cycle_sequence
        data_tests: [not_null]
      - name: attempt_sequence
        data_tests: [not_null]
      - name: payment_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [completed, failed]
