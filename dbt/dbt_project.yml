name: commerce_data_platform
version: "1.0.0"
config-version: 2

profile: commerce_data_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

on-run-end:
  - "-- depends_on: {{ ref('int_affected_business_dates') }}\n{{ record_affected_keys() }}"

models:
  commerce_data_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      dimensions:
        +materialized: table
        +schema: dimensions
      facts:
        +materialized: incremental
        +schema: facts
      metrics:
        +materialized: view
        +schema: metrics
